<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonStream PRO — Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #08080f;
            --bg-card: #0d0d18;
            --bg-surface: #12121f;
            --bg-hover: #1a1a2e;
            --border: rgba(168,85,247,0.12);
            --border-hover: rgba(168,85,247,0.35);
            --accent: #a855f7;
            --accent-2: #06b6d4;
            --accent-3: #ec4899;
            --text-1: #f0f0f5;
            --text-2: #8888a0;
            --text-3: #55556a;
            --gradient: linear-gradient(135deg, #a855f7, #ec4899, #f97316);
            --glow: 0 0 30px rgba(168,85,247,0.15);
            --radius: 14px;
            --radius-sm: 8px;
            --font-display: 'Orbitron', monospace;
            --font-body: 'Rajdhani', 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background: var(--bg-primary); color: var(--text-1); min-height: 100vh; }

        /* BG */
        .admin-bg { position: fixed; inset: 0; z-index: 0; }
        .admin-bg::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(168,85,247,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(168,85,247,0.03) 1px, transparent 1px); background-size: 60px 60px; }
        .admin-bg::after { content: ''; position: absolute; width: 500px; height: 500px; top: -100px; right: -100px; background: radial-gradient(circle, rgba(168,85,247,0.12), transparent 70%); filter: blur(80px); }

        /* Login */
        .admin-login { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: var(--bg-primary); }
        .admin-login .login-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 40px; text-align: center; max-width: 380px; width: 90%; }
        .admin-login h2 { font-family: var(--font-display); font-size: 1rem; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .admin-login .badge { font-size: 0.5rem; background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
        .admin-login p { font-size: 0.78rem; color: var(--text-2); margin-bottom: 20px; }
        .admin-login input { width: 100%; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; color: var(--text-1); font-family: var(--font-body); font-size: 0.85rem; outline: none; margin-bottom: 12px; }
        .admin-login input:focus { border-color: var(--accent); }
        .admin-login button { width: 100%; padding: 12px; background: var(--gradient); border: none; border-radius: var(--radius-sm); color: white; font-family: var(--font-body); font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .admin-login button:hover { box-shadow: var(--glow); }
        .login-error { color: #ef4444; font-size: 0.75rem; min-height: 18px; margin-bottom: 8px; }

        /* Header */
        .admin-header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; padding: 0 28px; height: 60px; background: rgba(8,8,15,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
        .admin-header .logo { display: flex; align-items: center; gap: 10px; }
        .admin-header .logo-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--gradient); border-radius: 8px; font-size: 0.9rem; color: white; }
        .admin-header .logo-text { font-family: var(--font-display); font-size: 0.85rem; }
        .admin-header .admin-badge { font-size: 0.5rem; background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-weight: 800; margin-left: 6px; }
        .admin-header .spacer { flex: 1; }
        .admin-header .logout-btn { padding: 6px 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-2); font-family: var(--font-body); font-size: 0.75rem; cursor: pointer; }
        .admin-header .logout-btn:hover { border-color: #ef4444; color: #ef4444; }

        /* Main */
        .admin-main { position: relative; z-index: 1; padding: 24px 28px; max-width: 1200px; margin: 0 auto; }

        /* Stats */
        .admin-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .admin-stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; text-align: center; }
        .admin-stat .val { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .admin-stat .label { font-size: 0.7rem; color: var(--text-3); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Cards */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .card-header h3 { font-family: var(--font-display); font-size: 0.8rem; color: var(--accent); display: flex; align-items: center; gap: 8px; }

        /* Generate form */
        .gen-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
        .gen-group { display: flex; flex-direction: column; gap: 4px; }
        .gen-group label { font-size: 0.65rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }
        .gen-group input, .gen-group select { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text-1); font-family: var(--font-body); font-size: 0.82rem; outline: none; }
        .gen-group input:focus, .gen-group select:focus { border-color: var(--accent); }
        .gen-btn { padding: 10px 20px; background: var(--gradient); border: none; border-radius: var(--radius-sm); color: white; font-family: var(--font-body); font-size: 0.82rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .gen-btn:hover { box-shadow: var(--glow); }

        /* Keys table */
        .keys-table { width: 100%; border-collapse: collapse; }
        .keys-table th { text-align: left; font-size: 0.65rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
        .keys-table td { padding: 10px; font-size: 0.8rem; border-bottom: 1px solid rgba(168,85,247,0.06); }
        .keys-table tr:hover td { background: var(--bg-surface); }
        .key-code { font-family: var(--font-display); font-size: 0.72rem; letter-spacing: 1px; color: var(--accent); cursor: pointer; }
        .key-code:hover { text-decoration: underline; }
        .key-status { display: inline-flex; align-items: center; gap: 4px; font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
        .key-status.active { background: rgba(16,185,129,0.15); color: #10b981; }
        .key-status.inactive { background: rgba(239,68,68,0.1); color: #ef4444; }
        .key-status.expired { background: rgba(249,115,22,0.1); color: #f97316; }
        .key-plan { font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
        .key-plan.pro { background: rgba(168,85,247,0.15); color: #a855f7; }
        .key-plan.ultimate { background: rgba(236,72,153,0.15); color: #ec4899; }
        .key-plan.trial { background: rgba(6,182,212,0.15); color: #06b6d4; }
        .action-btn { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-2); cursor: pointer; font-size: 0.65rem; margin-left: 4px; }
        .action-btn:hover { border-color: var(--accent); color: var(--accent); }
        .action-btn.delete:hover { border-color: #ef4444; color: #ef4444; }

        .empty-state { text-align: center; padding: 40px; color: var(--text-3); font-size: 0.85rem; }
        .empty-state i { display: block; font-size: 2rem; margin-bottom: 10px; opacity: 0.3; }

        .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 24px; background: var(--bg-card); border: 1px solid var(--accent); border-radius: var(--radius); color: var(--text-1); font-size: 0.82rem; z-index: 10000; transform: translateY(100px); opacity: 0; transition: all 0.35s; box-shadow: 0 0 30px rgba(168,85,247,0.2); }
        .toast.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 800px) { .admin-stats { grid-template-columns: 1fr 1fr; } .gen-form { flex-direction: column; } }
        @media (max-width: 500px) { .admin-stats { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="admin-bg"></div>

    <!-- Admin Login -->
    <div class="admin-login" id="adminLogin">
        <div class="login-card">
            <h2><i class="fas fa-bolt"></i> NeonStream <span class="badge">ADMIN</span></h2>
            <p>Log in met je admin wachtwoord</p>
            <input type="password" id="adminPassword" placeholder="Admin wachtwoord..." onkeydown="if(event.key==='Enter')adminLogin()">
            <div class="login-error" id="loginError"></div>
            <button onclick="adminLogin()"><i class="fas fa-lock"></i> Inloggen</button>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" style="display:none">
        <header class="admin-header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-bolt"></i></div>
                <span class="logo-text">NeonStream</span>
                <span class="admin-badge">ADMIN</span>
            </div>
            <div class="spacer"></div>
            <button class="logout-btn" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Uitloggen</button>
        </header>

        <main class="admin-main">
            <!-- Stats -->
            <div class="admin-stats">
                <div class="admin-stat"><div class="val" id="statTotal">0</div><div class="label">Totaal Keys</div></div>
                <div class="admin-stat"><div class="val" id="statActive">0</div><div class="label">Actieve Keys</div></div>
                <div class="admin-stat"><div class="val" id="statUsed">0</div><div class="label">Gebruikt</div></div>
                <div class="admin-stat"><div class="val" id="statExpired">0</div><div class="label">Verlopen</div></div>
            </div>

            <!-- Generate Keys -->
            <div class="card">
                <div class="card-header"><h3><i class="fas fa-key"></i> License Key Genereren</h3></div>
                <div class="gen-form">
                    <div class="gen-group">
                        <label>Plan</label>
                        <select id="genPlan">
                            <option value="pro">PRO</option>
                            <option value="ultimate">ULTIMATE</option>
                            <option value="trial">TRIAL (7 dagen)</option>
                        </select>
                    </div>
                    <div class="gen-group">
                        <label>Naam / Notitie</label>
                        <input type="text" id="genNote" placeholder="Bijv. klant naam...">
                    </div>
                    <div class="gen-group">
                        <label>Verloopdatum (optioneel)</label>
                        <input type="date" id="genExpires">
                    </div>
                    <div class="gen-group">
                        <label>Aantal</label>
                        <input type="number" id="genCount" value="1" min="1" max="50" style="width:70px">
                    </div>
                    <button class="gen-btn" onclick="generateKeys()"><i class="fas fa-plus"></i> Genereer</button>
                </div>
            </div>

            <!-- Keys List -->
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-list"></i> Alle License Keys</h3>
                    <div style="display:flex;gap:8px">
                        <button class="action-btn" onclick="exportKeys()" title="Exporteer"><i class="fas fa-download"></i></button>
                        <button class="action-btn delete" onclick="if(confirm('Alle keys verwijderen?')){localStorage.removeItem('neonstream_admin_keys');renderKeys()}" title="Alles wissen"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                <div id="keysContainer">
                    <div class="empty-state"><i class="fas fa-key"></i>Nog geen keys gegenereerd</div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="adminToast"></div>

    <script>
        const ADMIN_PASS_KEY = 'neonstream_admin_pass';
        const KEYS_KEY = 'neonstream_admin_keys';

        // Default admin password — change this!
        function getAdminPass() {
            return localStorage.getItem(ADMIN_PASS_KEY) || 'neonstream2024';
        }

        // Check if already logged in
        if (sessionStorage.getItem('admin_auth') === 'true') {
            document.getElementById('adminLogin').style.display = 'none';
            document.getElementById('adminPanel').style.display = '';
            renderKeys();
        }

        function adminLogin() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === getAdminPass()) {
                sessionStorage.setItem('admin_auth', 'true');
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminPanel').style.display = '';
                renderKeys();
            } else {
                document.getElementById('loginError').textContent = 'Verkeerd wachtwoord';
            }
        }

        function adminLogout() {
            sessionStorage.removeItem('admin_auth');
            location.reload();
        }

        function generateKey() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let key = '';
            for (let i = 0; i < 4; i++) {
                if (i > 0) key += '-';
                for (let j = 0; j < 4; j++) key += chars[Math.floor(Math.random() * chars.length)];
            }
            return key;
        }

        function generateKeys() {
            const plan = document.getElementById('genPlan').value;
            const note = document.getElementById('genNote').value;
            const expires = document.getElementById('genExpires').value;
            const count = Math.min(parseInt(document.getElementById('genCount').value) || 1, 50);

            const keys = JSON.parse(localStorage.getItem(KEYS_KEY) || '[]');

            let trialExpires = null;
            if (plan === 'trial') {
                const d = new Date();
                d.setDate(d.getDate() + 7);
                trialExpires = d.toISOString().split('T')[0];
            }

            const newKeys = [];
            for (let i = 0; i < count; i++) {
                const keyObj = {
                    key: generateKey(),
                    plan: plan,
                    note: note || '',
                    active: true,
                    created: new Date().toISOString(),
                    expires: expires || trialExpires || null,
                    used: false,
                    usedBy: null,
                    usedAt: null
                };
                keys.push(keyObj);
                newKeys.push(keyObj.key);
            }

            localStorage.setItem(KEYS_KEY, JSON.stringify(keys));
            renderKeys();

            if (count === 1) {
                showToast('Key gegenereerd: ' + newKeys[0]);
            } else {
                showToast(count + ' keys gegenereerd');
            }

            document.getElementById('genNote').value = '';
            document.getElementById('genExpires').value = '';
            document.getElementById('genCount').value = '1';
        }

        function renderKeys() {
            const keys = JSON.parse(localStorage.getItem(KEYS_KEY) || '[]');
            const container = document.getElementById('keysContainer');

            // Update stats
            document.getElementById('statTotal').textContent = keys.length;
            document.getElementById('statActive').textContent = keys.filter(k => k.active && !isExpired(k)).length;
            document.getElementById('statUsed').textContent = keys.filter(k => k.used).length;
            document.getElementById('statExpired').textContent = keys.filter(k => isExpired(k)).length;

            if (keys.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-key"></i>Nog geen keys gegenereerd</div>';
                return;
            }

            let html = `<table class="keys-table"><thead><tr><th>Key</th><th>Plan</th><th>Status</th><th>Notitie</th><th>Aangemaakt</th><th>Verloopt</th><th>Acties</th></tr></thead><tbody>`;

            [...keys].reverse().forEach((k, i) => {
                const idx = keys.length - 1 - i;
                const expired = isExpired(k);
                const statusClass = expired ? 'expired' : k.active ? 'active' : 'inactive';
                const statusText = expired ? 'Verlopen' : k.active ? (k.used ? 'Gebruikt' : 'Actief') : 'Uitgeschakeld';
                const created = new Date(k.created).toLocaleDateString('nl-NL');
                const expires = k.expires ? new Date(k.expires).toLocaleDateString('nl-NL') : '—';

                html += `<tr>
                    <td><span class="key-code" onclick="copyKey('${k.key}')" title="Klik om te kopieren">${k.key}</span></td>
                    <td><span class="key-plan ${k.plan}">${k.plan.toUpperCase()}</span></td>
                    <td><span class="key-status ${statusClass}">${statusText}</span></td>
                    <td style="color:var(--text-2);font-size:0.75rem">${k.note || '—'}</td>
                    <td style="color:var(--text-3);font-size:0.72rem">${created}</td>
                    <td style="color:var(--text-3);font-size:0.72rem">${expires}</td>
                    <td>
                        <button class="action-btn" onclick="toggleKey(${idx})" title="${k.active ? 'Uitschakelen' : 'Activeren'}"><i class="fas ${k.active ? 'fa-pause' : 'fa-play'}"></i></button>
                        <button class="action-btn" onclick="copyKey('${k.key}')" title="Kopieer"><i class="fas fa-copy"></i></button>
                        <button class="action-btn delete" onclick="deleteKey(${idx})" title="Verwijder"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function isExpired(k) {
            return k.expires && new Date(k.expires) < new Date();
        }

        function toggleKey(idx) {
            const keys = JSON.parse(localStorage.getItem(KEYS_KEY) || '[]');
            if (keys[idx]) {
                keys[idx].active = !keys[idx].active;
                localStorage.setItem(KEYS_KEY, JSON.stringify(keys));
                renderKeys();
                showToast(keys[idx].active ? 'Key geactiveerd' : 'Key uitgeschakeld');
            }
        }

        function deleteKey(idx) {
            if (!confirm('Deze key verwijderen?')) return;
            const keys = JSON.parse(localStorage.getItem(KEYS_KEY) || '[]');
            keys.splice(idx, 1);
            localStorage.setItem(KEYS_KEY, JSON.stringify(keys));
            renderKeys();
            showToast('Key verwijderd');
        }

        function copyKey(key) {
            navigator.clipboard.writeText(key).then(() => showToast('Gekopieerd: ' + key));
        }

        function exportKeys() {
            const keys = JSON.parse(localStorage.getItem(KEYS_KEY) || '[]');
            const text = keys.map(k => `${k.key}\t${k.plan}\t${k.active ? 'actief' : 'uit'}\t${k.note}\t${k.created}\t${k.expires || ''}`).join('\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'neonstream_keys_' + new Date().toISOString().split('T')[0] + '.txt';
            a.click();
            showToast('Keys geexporteerd');
        }

        function showToast(msg) {
            const t = document.getElementById('adminToast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
